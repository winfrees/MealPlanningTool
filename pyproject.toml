[project]
name = "mealplan"
version = "0.1.0"
description = "Household meal planning: weekly plans, prep sessions, and shopping lists netted against inventory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "pint>=0.24",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
]

[project.scripts]
mealctl = "mealplan.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mealplan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["mealplan"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
